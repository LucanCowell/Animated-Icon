<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icons</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="animatedcontainer">
        <div class="animatedimgContainer"></div>
    </div>

    <script>
            const images = [
                '/img/LucanWebDesigns.logo.normal.png',
                '/img/LucanWebDesigns.logo.eyebrow-left.png',
                '/img/LucanWebDesigns.logo.down.png',
                '/img/LucanWebDesigns.logo.eyebrows-raised.png',
                '/img/LucanWebDesigns.logo.eyebrow-right.png',
                '/img/LucanWebDesigns.logo.up.png',
                '/img/LucanWebDesigns.logo.squint.png',
                '/img/LucanWebDesigns.logo.happy.png',
            ];

            const imgContainer = document.querySelector('.animatedimgContainer');

            function changeToRandomImage() {
                const randomIndex = Math.floor(Math.random() * images.length);

                imgContainer.style.backgroundImage = `url('${images[randomIndex]}')`;
            }

            changeToRandomImage();

            setInterval(changeToRandomImage, 10000);

    </script>
</body>
</html>
